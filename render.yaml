# Blueprint de Render — despliega la aplicación como contenedor a partir del Dockerfile.
# La base de datos es PostgreSQL administrado en Neon: sus credenciales se piden
# al crear el Blueprint (sync: false) y nunca se versionan aquí.
services:
  - name: reservas-servicios
    type: web
    runtime: docker
    plan: free
    region: oregon
    branch: main
    # Render publica cada push a main; el workflow de CD verifica la salud después.
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # Secreto de firma de los JWT: Render genera un valor aleatorio.
      - key: JWT_SECRET
        generateValue: true
      # Conexión a Neon. DB_URL con el formato:
      # jdbc:postgresql://<host>.neon.tech/<base>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # URL pública del servicio; se usa en el enlace de verificación por correo.
      - key: APP_BASE_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Proveedor SMTP real. Mailpit (localhost:1025) solo existe en desarrollo:
      # dentro del contenedor no hay nada escuchando ahí, así que apuntar a
      # localhost no falla al arrancar, falla al enviar —y en silencio, porque
      # NotificadorVerificacionCuenta registra el fallo y no revierte el registro.
      #
      # ATENCIÓN: estos servicios NO se crearon desde este blueprint, así que los
      # valores del panel de Render son los que manda y este archivo no los
      # sobreescribe. El 2026-10-13 se encontró la deriva: acá decía MAIL_PORT 587
      # y producción corría 1025 con MAIL_HOST localhost. Nadie lo notó porque
      # nada compara las dos cosas. Si cambiás algo acá, cambialo también en el
      # panel hasta que los servicios se adopten en el blueprint.
      # OJO con el nombre: tiene que ser el de sendinblue, no el de brevo.
      # El certificado que sirve smtp-relay.brevo.com:587 vale solo para
      # smtp-relay-offshore-southamerica-east-v2.sendinblue.com y
      # smtp-relay.sendinblue.com. El nombre nuevo NO está en el certificado, así
      # que cualquier cliente que valide el nombre durante STARTTLS —Java lo hace—
      # corta el handshake antes de autenticar. El síntoma es MailSendException y
      # cero eventos del lado de Brevo, porque la sesión nunca llega a enviar.
      # Verificado el 2026-10-13 contra la misma IP (1.179.117.2) con los dos
      # nombres: sendinblue autentica y acepta el mensaje, brevo falla el TLS.
      - key: MAIL_HOST
        value: smtp-relay.sendinblue.com
      # 2525 y NO 587. Render no deja salir el 587 desde el contenedor: la
      # conexión TCP ni se establece y el log queda en «Connect timed out», sin
      # que Brevo registre un solo intento. 2525 es el mismo relay, el mismo
      # certificado y la misma secuencia STARTTLS, y sí pasa. Verificado el
      # 2026-10-13: con 587 el envío falla, con 2525 Brevo reporta «delivered».
      - key: MAIL_PORT
        value: "2525"
      # Credenciales SMTP del proveedor: se ponen a mano, nunca en el repositorio.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      # Debe ser un remitente verificado en el proveedor. Un dominio que no
      # controlamos (por ejemplo reservaya.app) hace que el envío se rechace.
      - key: APP_MAIL_FROM
        sync: false
      - key: JWT_EXPIRATION
        value: 30m
      - key: SWAGGER_ENABLED
        value: "true"
