name: CD

# El pipeline es el único que despliega.
#
# Render tiene `autoDeploy` activo, pero nunca se dispara: la cuenta no recibe los
# eventos de push de GitHub, así que en veinte días no hubo un solo despliegue por
# commit. Antes este workflow solo consultaba `/actuator/health`, y eso dio un falso
# verde: un servicio que corre una versión de hace tres semanas también responde `UP`.
# La salud mide que la aplicación esté viva, no que lo publicado sea lo que se mergeó.
#
# Ahora el despliegue se pide por la API de Render y se espera su estado real, con el
# commit publicado como evidencia. La lógica vive en `.github/scripts/desplegar_render.py`
# para poder ejecutarla y probarla fuera del runner.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar en Render
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: produccion
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Desplegar y esperar el resultado
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          # Identificadores de servicio: no son secretos, pero se pueden sobrescribir
          # con una variable del repositorio si cambian los servicios.
          RENDER_SERVICIOS: ${{ vars.RENDER_SERVICIOS || 'backend=srv-daos383tqb8s73ed8r00,frontend=srv-daost9btqb8s73eg538g' }}
          # El commit sobre el que corrió CI; en ejecución manual, la punta de la rama.
          COMMIT_ESPERADO: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 .github/scripts/desplegar_render.py

      - name: Comprobar la salud del backend
        env:
          URL_SALUD: ${{ vars.URL_SALUD_BACKEND || 'https://reservaya-vvke.onrender.com/actuator/health' }}
        run: |
          echo "Consultando $URL_SALUD"
          for intento in $(seq 1 15); do
            # 60 s por intento: el arranque en frío del plan gratuito tarda cerca de un minuto.
            estado=$(curl -fsS --max-time 60 "$URL_SALUD" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","DESCONOCIDO"))' \
              2>/dev/null || echo "SIN_RESPUESTA")
            echo "Intento $intento: $estado"
            if [ "$estado" = "UP" ]; then
              echo "Backend respondiendo en $URL_SALUD" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "El backend no reportó UP después del despliegue." >&2
          exit 1
