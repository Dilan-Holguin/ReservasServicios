# QA independiente. Crear un Blueprint con esta ruta desde el repositorio del backend.
# Las URLs públicas se completan en Render después de conocer los dominios asignados.
services:
  - name: reservaya-api-qa
    type: web
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: APP_MAIL_FROM
        sync: false
      - key: SWAGGER_ENABLED
        value: "true"

  - name: reservaya-web-qa
    type: web
    runtime: static
    autoDeploy: false
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
